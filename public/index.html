<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReviseRush – GCSE revision party game</title>
<meta name="description" content="ReviseRush is a free GCSE revision party game. Play solo or with friends: name answers for GCSE Science, Geography, History, Music, Computer Science, Business Studies, French and Religious Studies before the clock runs out.">
<meta property="og:title" content="ReviseRush – GCSE revision party game">
<meta property="og:description" content="Play solo or with friends. Name answers for GCSE Science, Geography, History, Music, Computer Science, Business Studies, French and Religious Studies.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f9d6b'/%3E%3Cpath d='M20 34l9 9 16-19' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#e9f6ef;--card:#fff;--ink:#14324a;--mut:#58717f;--g:#1f9d6b;--on:#fff;--blue:#3a7bd5;--pur:#7c5cd6;--sun:#e8a712;--bad:#e8573f;--line:#cfe3da}
@media (prefers-color-scheme:dark){:root{--bg:#0e2230;--card:#163247;--ink:#e8f3ee;--mut:#9fb8c6;--g:#34c58a;--on:#08301f;--blue:#6aa3f0;--pur:#a58cf2;--sun:#f4c04d;--bad:#ff7a60;--line:#2a4a60}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Figtree,system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:660px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big,.pts,.turn,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:2.3rem;line-height:1.1}h2{font-size:1.35rem}p{margin:.4em 0}
.mut{color:var(--mut)}.bad{color:var(--bad)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}.brand{font-size:2.4rem}.brand span{color:var(--g)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
button{font:600 1rem Figtree,system-ui,sans-serif;border:0;border-radius:12px;padding:12px 18px;background:var(--g);color:var(--on);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.ghost,.back,.lnk{background:transparent;color:var(--ink);border:2px solid var(--line)}
.back{border:0;padding:6px 0;margin-bottom:8px}.lnk{padding:4px 10px;font-size:.9rem;color:var(--mut)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input:not([type=checkbox]){font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.menu{display:grid;gap:12px;margin:18px 0}
.mb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px 18px;font:800 1.3rem "Bricolage Grotesque",Figtree,sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);border-left:10px solid var(--g);border-radius:16px;width:100%}
.mb span{font:400 1rem Figtree,system-ui,sans-serif;color:var(--mut)}
.mb.b{border-left-color:var(--blue)}.mb.p{border-left-color:var(--pur)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sets label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mut)}.sets select{margin-top:4px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chipb{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:8px 14px;border-radius:20px}.chipb.on{border-color:var(--g);background:var(--g);color:var(--on)}.chipb:disabled{opacity:.45}
.mb.a{border-left-color:var(--sun)}.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 10px}.lb{width:100%;border-collapse:collapse}.lb th,.lb td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}.lb tr.me td{font-weight:800;color:var(--g)}
.sub{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tps{padding:0 0 8px 8px;display:grid;gap:2px}label.c{display:block;padding:2px 0}
.row{display:flex;gap:10px;align-items:center}.row>input{flex:1}
.scores{display:flex;gap:8px;overflow-x:auto;padding:2px}
.pl{flex:1 0 110px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
.pl.on{border-color:var(--g);transform:translateY(-3px)}.pl.out{opacity:.4}
.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-size:1.4rem}.heart{color:var(--bad)}.heart.lost{opacity:.2}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g);width:100%}#tb i{background:var(--bad)}
.q{font-size:1.8rem;margin:6px 0 10px}.turn{font-size:1.2rem}#msg{min-height:1.6em;font-weight:600}
.code{font:800 3rem "Bricolage Grotesque",sans-serif;letter-spacing:.15em;color:var(--g)}
.chip{display:inline-block;border:2px solid var(--g);color:var(--g);border-radius:20px;padding:2px 12px;margin:3px 4px 3px 0;font-weight:600}
.chip.hi{border-color:var(--sun);color:var(--sun)}.chip.miss{border-style:dashed;opacity:.85}
@media (prefers-reduced-motion:reduce){.pl.on{transform:none}}

header.nav{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:10}
.nav-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.nav-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nbtn{background:transparent;color:var(--ink);border:2px solid transparent;padding:7px 12px;border-radius:10px;font-weight:600}
.nbtn.on{background:var(--bg);border-color:var(--line);color:var(--g)}
.nbtn.play{background:var(--g);color:var(--on)}
main.wide{max-width:920px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.82rem;font-weight:600;color:var(--mut);margin-right:6px}
.ms{background:var(--bg);border-left:4px solid var(--g);padding:10px 14px;border-radius:8px;margin-top:10px}
.countdown{font:800 1.35rem "Bricolage Grotesque",sans-serif;color:var(--g);margin-top:6px}
</style></head><body><header id="topnav" class="nav"></header><main id="app"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO='<svg viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="ReviseRush logo"><rect width="64" height="64" rx="16" fill="var(--g)"/><rect x="9" y="13" width="46" height="31" rx="9" fill="#fff"/><path d="M19 43v11l12-11z" fill="#fff"/><path d="M21 29l8 8 14-17" fill="none" stroke="var(--g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="12" r="8" fill="var(--sun)"/></svg>';
let ws=null,s=null,off=0,err='',mt=null,view='menu',sel=null,act=null,board={},needsProfile=false,sess=null,me=null,cfgSrv={accounts:false},meta=null,mode='in',msgA='',dsub=null,dbd={},lbp='daily',lbs=null,lbb=null,cfg={lives:3,turn:20,round:60,rounds:5,skips:2,need:5};
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const isHost=()=>s.host===s.you;

function connect(first){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send(first);
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='state'){s=m;off=m.serverNow-Date.now();render()}
    else if(m.t==='toast')toast(m);
    else if(m.t==='err'){err=m.text;if(!s)home()}};
  ws.onclose=()=>{if(s)app.insertAdjacentHTML('afterbegin','<p class="bad">Connection lost. Refresh the page to rejoin.</p>')};
}
function leave(){const w=ws;s=null;sel=null;act=null;board={};ws=null;view='menu';err='';if(w)w.close();home();if(sess&&cfgSrv.accounts)loadMe().then(()=>{if(view==='menu'&&!s)home()})}
function leaveGame(){if(confirm('Leave this game and go back to the home page?'))leave()}

async function ensureFresh(){if(sess&&sess.expires_at-Date.now()/1000<120){try{const j=await api('/api/refresh',{refresh_token:sess.refresh_token});store(j.session)}catch{store(null);me=null}}}
const store=v=>{sess=v;try{v?localStorage.setItem('rr_sess',JSON.stringify(v)):localStorage.removeItem('rr_sess')}catch{}};
async function api(path,body,auth){
  const h={'Content-Type':'application/json'};
  if(auth){await ensureFresh();if(!sess)throw new Error('Please sign in again.');h.Authorization='Bearer '+sess.access_token}
  const r=await fetch(path,{method:body===null||body===undefined?'GET':'POST',headers:h,body:body===null||body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong.');e.code=j.code;throw e}return j}
async function loadMe(){me=null;needsProfile=false;if(!sess)return;try{me=await api('/api/me',null,true)}catch(e){me=null;if(e.code==='no_profile')needsProfile=true}}
async function loadMeta(){if(!meta){try{meta=await api('/api/subjects')}catch{meta=[]}}}
async function boot(){try{sess=JSON.parse(localStorage.getItem('rr_sess')||'null')}catch{sess=null}
  try{cfgSrv=await api('/api/config')}catch{}
  if(sess&&cfgSrv.accounts){await loadMe();if(needsProfile){view='setup';pageTab='game'}}renderShell()}
function acctBar(){if(!cfgSrv.accounts)return '';
  if(needsProfile)return '<div class="acct"><span class="bad">Finish setting up your account</span><button class="lnk" id="su">Finish</button></div>';
  return me?`<div class="acct"><span>Hi <b>${esc(me.display_name)}</b> · 🔥 ${me.streak}-day streak</span><button class="lnk" id="pf">Profile</button></div>`
  :`<div class="acct"><span class="mut">Sign in to keep streaks and join leaderboards</span><button class="lnk" id="si">Sign in</button></div>`}
function dailyCard(){const r=s.result;
  if(!r)return '<div class="card"><p>Saving your score…</p></div>';
  if(r.error)return '<div class="card"><p class="bad">Could not save your score. Check your connection and try again.</p></div>';
  return `<div class="card"><h2>Daily challenge complete</h2><p><b>${s.players[0].pts}</b> points · ranked <b>#${r.rank}</b> today</p><p>🔥 <b>${r.streak}</b>-day streak (best ${r.best})</p><button id="lbx" style="margin-top:8px">View leaderboard</button></div>`}

function home(){
  if(view==='menu'){
    app.innerHTML=`<div class="logo">${LOGO}<div class="brand">Revise<span>Rush</span></div></div>
    <p class="mut">The GCSE revision party game. Name answers before the clock runs out. Higher-level answers score more.</p>${acctBar()}
    <div class="menu">${cfgSrv.accounts?'<button class="mb a" id="m4">Daily challenge<span>New questions every day. Build your streak.</span></button>':''}
    <button class="mb" id="m1">Play solo<span>Practise on your own</span></button>
    <button class="mb b" id="m2">Host a game<span>Create a room for friends or your class</span></button>
    <button class="mb p" id="m3">Join a game<span>Enter a room code</span></button>
    ${cfgSrv.accounts?'<button class="mb" id="m5">Leaderboards<span>See who is top today</span></button>':''}</div>
    <div class="card"><h2>How to play</h2><p>Take turns naming answers to the question. Run out of time on your turn and you lose a life.</p><p>A correct answer is worth 10 points. A grade 7–9 answer is worth 50. In a hosted game you can skip the current question a limited number of times, for −10 points. Solo mode has no timer: name enough different answers to move on to the next question.</p><p class="mut">Covers GCSE Biology, Chemistry, Physics, Geography, History, Music, Computer Science, Business Studies, French and Religious Studies. Choose your subject, exam board and topics.</p></div>`;
    [['m1','solo'],['m2','host'],['m3','join']].forEach(([id,v])=>$(id).onclick=()=>{view=v;err='';home()});
    if($('m4'))$('m4').onclick=()=>{err='';view=me?'daily':'auth';mode='in';home()};
    if($('m5'))$('m5').onclick=()=>{view='lb';home()};
    if($('su'))$('su').onclick=()=>{view='setup';home()};
    if($('pf'))$('pf').onclick=()=>{err='';view='profile';home()};
    if($('si'))$('si').onclick=()=>{view='auth';mode='in';msgA='';home()};
    return;
  }
  if(view==='auth')return authView();
  if(view==='daily')return dailyView();
  if(view==='lb')return lbView();
  if(view==='profile')return profileView();
  if(view==='setup')return setupView();
  const j=view==='join',title={solo:'Play solo',host:'Host a game',join:'Join a game'}[view];
  app.innerHTML=`<button class="back" id="bk">← Back</button><h1>${title}</h1>
  <div class="card"><input id="nm" maxlength="16" placeholder="Your name" aria-label="Your name" value="${me&&!j?esc(me.display_name):''}">${j?'<input id="cd" maxlength="4" placeholder="Room code" aria-label="Room code" style="text-transform:uppercase;margin-top:8px">':''}
  <button id="go" style="width:100%;margin-top:10px">${j?'Join':'Continue'}</button></div><p class="bad">${esc(err)}</p>`;
  $('bk').onclick=()=>{view='menu';err='';home()};
  const go=()=>{err='';connect({t:j?'join':'create',name:$('nm').value,code:j?$('cd').value:undefined,solo:view==='solo'})};
  $('go').onclick=go;app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});$('nm').focus();
}
function yearSelect(v){return `<select id="yr" aria-label="Year group" style="width:100%"><option value="">Choose your year</option>${[9,10,11,12,13].map(y=>`<option value="${y}" ${+v===y?'selected':''}>Year ${y}</option>`).join('')}</select>`}
function subjectBoxes(sel){return meta.map(x=>`<label class="c"><input type="checkbox" data-sj value="${esc(x.subject)}" ${sel.includes(x.subject)?'checked':''}> ${esc(x.subject)}</label>`).join('')}
const picked=()=>({year:+$('yr').value||null,subjects:[...app.querySelectorAll('[data-sj]:checked')].map(c=>c.value)});
function setupView(){
  if(!sess){view='auth';return home()}
  if(!meta){app.innerHTML='<p class="mut">Loading…</p>';loadMeta().then(()=>{if(view==='setup')home()});return}
  app.innerHTML=`<h1>Finish setting up</h1><p class="mut">Your login works. Choose a display name, your year and your subjects to finish your profile.</p>
  <div class="card"><input id="dn" maxlength="16" placeholder="Display name (shown on leaderboards)" aria-label="Display name"></div>
  <div class="card"><h2>About you</h2><p class="mut">Your year group</p>${yearSelect('')}<p class="mut" style="margin-top:12px">Subjects you study</p>${subjectBoxes([])}</div>
  <button id="go" style="width:100%">Save and continue</button><button class="lnk" id="out" style="margin-top:8px">Sign out</button><p class="bad">${esc(err)}</p>`;
  $('out').onclick=()=>{store(null);me=null;needsProfile=false;view='menu';err='';home()};
  $('go').onclick=async()=>{try{err='';await api('/api/setup',{displayName:$('dn').value,...picked()},true);needsProfile=false;await loadMe();view='menu';home()}catch(e){err=e.message;home()}};
}
function authView(){
  const up=mode==='up';
  if(up&&!meta){app.innerHTML='<p class="mut">Loading…</p>';loadMeta().then(()=>{if(view==='auth')home()});return}
  app.innerHTML=`<button class="back" id="bk">← Back</button><h1>${up?'Create account':'Sign in'}</h1>
  <div class="card">${up?'<input id="dn" maxlength="16" placeholder="Display name (shown on leaderboards)" aria-label="Display name" style="margin-bottom:8px">':''}
  <input id="em" type="email" placeholder="Email" aria-label="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" aria-label="Password" autocomplete="${up?'new-password':'current-password'}" style="margin-top:8px"></div>
  ${up?`<div class="card"><h2>About you</h2><p class="mut">Your year group</p>${yearSelect('')}<p class="mut" style="margin-top:12px">Subjects you study (choose all that apply)</p>${subjectBoxes([])}</div>`:''}
  <button id="go" style="width:100%">${up?'Create account':'Sign in'}</button>
  ${up?'<p class="mut" style="margin-top:10px">Use a nickname, not your real name. Your email is never shown to other players. You must be 13 or over. <a href="/privacy" target="_blank">Privacy notice</a></p>':''}
  <button class="lnk" id="sw" style="margin-top:8px">${up?'I already have an account':'Create an account'}</button>
  <p class="${msgA.startsWith('✓')?'':'bad'}">${esc(msgA)}</p>`;
  $('bk').onclick=()=>{view='menu';msgA='';home()};
  $('sw').onclick=()=>{mode=up?'in':'up';msgA='';home()};
  $('go').onclick=async()=>{
    try{msgA='';const j=await api(up?'/api/signup':'/api/login',{email:$('em').value,password:$('pw').value,displayName:up?$('dn').value:undefined,...(up?picked():{})});
      if(j.session){store(j.session);await loadMe();view=needsProfile||j.needsProfile?'setup':(me&&!me.year)?'profile':'menu';home()}else{msgA='✓ '+(j.message||'Check your email to confirm, then sign in.');mode='in';home()}}
    catch(e){msgA=e.message;home()}};
}
async function dailyView(){
  await loadMeta();if(view!=='daily')return;
  if(!me){view='auth';return home()}
  if(!meta.length){app.innerHTML='<button class="back" id="bk">← Back</button><p>No questions available yet.</p>';$('bk').onclick=()=>{view='menu';home()};return}
  const mine=me.subjects||[],ordered=[...meta].sort((a,b)=>mine.includes(b.subject)-mine.includes(a.subject));if(!dsub)dsub=ordered[0].subject;const S=meta.find(x=>x.subject===dsub)||ordered[0];dsub=S.subject;
  const bd=S.boards.some(b=>b.board===dbd[dsub])?dbd[dsub]:S.boards[0].board;
  const done=me.doneToday.find(d=>d.subject===dsub&&d.board===bd);
  app.innerHTML=`<button class="back" id="bk">← Back</button><h1>Daily challenge</h1><p class="mut">🔥 ${me.streak}-day streak · best ${me.best}</p>
  <div class="card"><h2>1. Subject</h2><div class="chips">${ordered.map(x=>`<button class="chipb ${x.subject===dsub?'on':''}" data-s="${esc(x.subject)}">${mine.includes(x.subject)?'★ ':''}${esc(x.subject)}${me.doneToday.some(d=>d.subject===x.subject)?' ✓':''}</button>`).join('')}</div>
  <h2 style="margin-top:16px">2. Exam board</h2><div class="chips">${S.boards.map(b=>`<button class="chipb ${b.board===bd?'on':''}" data-b="${esc(b.board)}">${esc(b.board)}</button>`).join('')}</div>
  <p class="mut" style="margin-top:12px">5 questions, no timer. Name 3 different answers for each. Everyone gets the same questions today.</p></div>
  ${done?`<div class="card"><p>✓ Done today: <b>${done.score}</b> points. Come back tomorrow, or try another subject.</p></div>`:'<button id="st" style="width:100%;font-size:1.2rem">Start today’s challenge</button>'}
  ${err?`<p class="bad">${esc(err)}</p>`:''}`;
  $('bk').onclick=()=>{view='menu';err='';home()};
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{dsub=b.dataset.s;err='';dailyView()});
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{dbd[dsub]=b.dataset.b;err='';dailyView()});
  if($('st'))$('st').onclick=async()=>{err='';await ensureFresh();if(!sess){view='auth';return home()}connect({t:'create',solo:true,daily:{subject:dsub,board:bd},token:sess.access_token})};
}
async function lbView(){
  await loadMeta();if(view!=='lb')return;
  if(!meta.length){app.innerHTML='<button class="back" id="bk">← Back</button><p>No questions available yet.</p>';$('bk').onclick=()=>{view='menu';home()};return}
  const S=meta.find(x=>x.subject===lbs)||meta[0];lbs=S.subject;const bd=S.boards.some(b=>b.board===lbb)?lbb:S.boards[0].board;lbb=bd;
  const tabs=[['daily','Today'],['weekly','This week'],['alltime','All time'],['streak','Streaks']];
  app.innerHTML=`<button class="back" id="bk">← Back</button><h1>Leaderboards</h1>
  <div class="chips">${tabs.map(([k,t])=>`<button class="chipb ${k===lbp?'on':''}" data-p="${k}">${t}</button>`).join('')}</div>
  ${lbp==='streak'?'':`<div class="sets" style="margin:12px 0"><label>Subject<select id="ls">${meta.map(x=>`<option ${x.subject===lbs?'selected':''}>${esc(x.subject)}</option>`).join('')}</select></label><label>Exam board<select id="lbd">${S.boards.map(b=>`<option ${b.board===bd?'selected':''}>${esc(b.board)}</option>`).join('')}</select></label></div>`}
  <div class="card" id="lbt"><p class="mut">Loading…</p></div>`;
  $('bk').onclick=()=>{view='menu';home()};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{lbp=b.dataset.p;lbView()});
  if($('ls'))$('ls').onchange=e=>{lbs=e.target.value;lbView()};
  if($('lbd'))$('lbd').onchange=e=>{lbb=e.target.value;lbView()};
  try{const j=await api(`/api/leaderboard?period=${lbp}&subject=${encodeURIComponent(lbs)}&board=${encodeURIComponent(bd)}`);if(!$('lbt'))return;

function scores(){return `<div class="scores">${s.players.map(p=>`<div class="pl ${p.id===s.turn?'on':''} ${p.lives<=0?'out':''}"><b>${esc(p.name)}${p.id===s.you?' (you)':''}${p.on?'':' ⚠'}</b><span class="pts">${p.pts}</span> ${s.solo?'':[...Array(s.set.lives).keys()].map(k=>`<span class="heart ${k>=p.lives?'lost':''}">♥</span>`).join('')}</div>`).join('')}</div>`}

function lobby(){
  const y=window.scrollY;
  if(!sel)sel=new Set();
  if(!act)act=s.bank[0].subject;
  const opt=(k,vals,lab)=>`<label>${lab}<select data-k="${k}">${vals.map(v=>`<option ${cfg[k]===v?'selected':''}>${v}</option>`).join('')}</select></label>`;
  const cnt=sb=>[...sel].filter(k=>k.startsWith(sb+'|')).length;
  const S=s.bank.find(x=>x.subject===act);
  const bd=board[act]||(S.boards.find(b=>b.topics.length)||S.boards[0]).board;
  const B=S.boards.find(b=>b.board===bd);
  const key=n=>act+'|'+bd+'|'+n;
  const subs=s.bank.map(x=>`<button class="chipb ${x.subject===act?'on':''}" data-s="${esc(x.subject)}">${esc(x.subject)}${cnt(x.subject)?` (${cnt(x.subject)})`:''}</button>`).join('');
  const boards=S.boards.map(b=>`<button class="chipb ${b.board===bd?'on':''}" data-b="${esc(b.board)}" ${b.topics.length?'':'disabled'}>${esc(b.board)}${b.topics.length?'':' (coming soon)'}</button>`).join('');
  const tps=B.topics.length?B.topics.map(n=>`<label class="c"><input type="checkbox" data-t="${esc(n)}" ${sel.has(key(n))?'checked':''}> ${esc(n)}</label>`).join(''):'<p class="mut">No questions for this board yet.</p>';
  app.innerHTML=`<button class="back" id="lv">← Leave</button><h1>${s.solo?'Solo practice':'Lobby'}</h1>
  ${s.solo?'':`<div class="card"><p class="mut">Share this code:</p><div class="code">${s.code}</div></div><div class="card"><h2>Players (${s.players.length}/8)</h2>${s.players.map(p=>`<p>${esc(p.name)}${p.id===s.host?' (host)':''}</p>`).join('')}</div>`}
  ${isHost()?`<div class="card"><h2>Settings</h2><div class="sets">${s.solo?opt('rounds',[3,5,8,10,15],'Questions')+opt('need',[3,5,8,10],'Answers needed per question'):opt('lives',[1,2,3,4,5],'Lives')+opt('turn',[10,15,20,30,45],'Seconds per turn')+opt('round',[30,60,90,120],'Seconds per round')+opt('rounds',[3,5,8,10,15],'Rounds')+opt('skips',[0,1,2,3],'Skips each')}</div></div>
  <div class="card"><h2>1. Subject</h2><div class="chips">${subs}</div>
  <h2 style="margin-top:16px">2. Exam board</h2><div class="chips">${boards}</div>
  <h2 style="margin-top:16px">3. Topics</h2><div class="row" style="margin-bottom:6px"><button class="lnk" id="all">Select all</button><button class="lnk" id="none">Clear</button></div><div class="tps">${tps}</div>
  <p class="mut" style="margin-top:10px">${sel.size} topic${sel.size===1?'':'s'} selected. You can mix subjects: pick a subject, choose its topics, then pick another.</p></div>
  <button id="st" style="width:100%;font-size:1.2rem" ${sel.size?'':'disabled'}>Start game</button>`:'<p class="mut">Waiting for the host to start…</p>'}`;
  $('lv').onclick=leave;if(!isHost())return;
  app.querySelectorAll('select').forEach(e=>e.onchange=()=>{cfg[e.dataset.k]=+e.value});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{act=b.dataset.s;lobby()});
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const nb=b.dataset.b;[...sel].forEach(k=>{if(k.startsWith(act+'|')&&!k.startsWith(act+'|'+nb+'|'))sel.delete(k)});board[act]=nb;lobby()});
  app.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{c.checked?sel.add(key(c.dataset.t)):sel.delete(key(c.dataset.t));lobby()});
  $('all').onclick=()=>{B.topics.forEach(n=>sel.add(key(n)));lobby()};$('none').onclick=()=>{B.topics.forEach(n=>sel.delete(key(n)));lobby()};
  $('st').onclick=()=>send({t:'start',topics:[...sel],set:cfg});
  window.scrollTo(0,y);
}

function render(){
  const v=$('ans')?$('ans').value:'';
  if(s.phase==='lobby')return lobby();
  const top=s.players.slice().sort((a,b)=>b.pts-a.pts);
  if(s.phase==='play'){
    const mine=s.turn===s.you,who=s.players.find(p=>p.id===s.turn),me=s.players.find(p=>p.id===s.you);
    app.innerHTML=`<button class="back" id="hm">← Home</button>${scores()}<div class="card"><p class="mut">Round ${s.ri+1} of ${s.n} · ${esc(s.topic)}</p><div class="q big">${esc(s.q)}</div>
    ${s.solo?`<p class="turn">Found ${s.log.length} of ${s.set.need} different answers</p><div class="bar"><i style="width:${Math.min(100,s.log.length/s.set.need*100)}%"></i></div><p class="mut">No timer. Take your time and name ${s.set.need} to move on.</p>`:`<div class="bar" id="rb"><i></i></div><p class="mut" id="rt"></p>
    <div class="turn">${mine?'Your turn!':esc(who.name)+'’s turn'}</div><div class="bar" id="tb"><i></i></div>`}
    <div class="row"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${mine?'Type your answer':'Wait for your turn'}" aria-label="Your answer" ${mine?'':'disabled'}><button id="sub" ${mine?'':'disabled'}>Answer</button></div>
    ${s.solo?'<button class="ghost" id="sk" style="margin-top:8px">Skip question</button>':s.set.skips?`<button class="ghost" id="sk" style="margin-top:8px" ${mine&&me.skips>0?'':'disabled'}>Skip question (${me.skips} left, −10 points)</button>`:''}
    <p id="msg"></p><div>${s.log.map(l=>`<span class="chip ${l.tier===50?'hi':''}">${esc(l.text)} (${esc(l.by)})</span>`).join('')}</div></div>`;
    const go=()=>{const a=$('ans');if(a.value.trim()){send({t:'answer',text:a.value});a.value=''}};
    $('sub').onclick=go;$('ans').onkeydown=e=>{if(e.key==='Enter')go()};if($('sk'))$('sk').onclick=()=>send({t:'skip'});$('hm').onclick=leaveGame;
    if(mine){$('ans').value=v;$('ans').focus()}
  }else if(s.phase==='between'){
    app.innerHTML=`<button class="back" id="hm">← Home</button><div class="card"><h2>Round over</h2><p class="mut">${esc(s.q)}</p><p><b>${s.solo?'Answers you missed':'Answers nobody found'}</b> (gold = grade 7–9):</p>
    <div>${s.missed.map(m=>`<span class="chip miss ${m.tier===50?'hi':''}">${esc(m.text)}</span>`).join('')||'You found every answer!'}</div></div>
    <div class="card">${top.map(p=>`<p><b>${esc(p.name)}</b>: ${p.pts} points ${p.lives>0?'':'(out)'}${s.rpts[p.name]?' · +'+s.rpts[p.name]+' this round':''}</p>`).join('')}</div>
    ${isHost()?`<button id="nx" style="width:100%">${s.last?'See results':'Next round'}</button>`:'<p class="mut">Waiting for the host…</p>'}`;
    if(isHost())$('nx').onclick=()=>send({t:'next'});$('hm').onclick=leaveGame;
  }else{
    app.innerHTML=`<h1>${s.daily?'Daily challenge':s.solo?'Game over!':esc(top[0].name)+' wins!'}</h1>${s.daily?dailyCard():''}<div class="card">${top.map((p,i)=>`<p>${i+1}. <b>${esc(p.name)}</b>: ${p.pts} points</p>`).join('')}</div>
    <h2 style="margin-top:22px">Revision summary</h2><p class="mut">Every answer from your game. <span class="chip">✓ You said it</span> <span class="chip miss">You missed it</span> <span class="chip hi">Grade 7–9</span></p>
    ${(s.review||[]).map(r=>`<div class="card"><p class="mut">${esc(r.topic)}</p><p><b>${esc(r.q)}</b></p>${r.answers.map(a=>`<span class="chip ${a.tier===50?'hi':''} ${a.by===s.you?'':'miss'}">${a.by===s.you?'✓ ':''}${esc(a.text)}</span>`).join('')}</div>`).join('')}
    ${s.daily?'':isHost()?`<button id="ag" style="width:100%">${s.solo?'Play again':'Back to lobby'}</button>`:'<p class="mut">Waiting for the host…</p>'}<button class="back" id="hm" style="margin-top:10px">Back to home</button>`;
    if($('ag'))$('ag').onclick=()=>send({t:'again'});$('hm').onclick=leave;if($('lbx')){const dd=s.daily;$('lbx').onclick=()=>{leave();lbp='daily';lbs=dd.subject;lbb=dd.board;view='lb';home()}}
  }
}
function toast(m){const e=$('msg');if(!e)return;e.textContent=m.text;e.style.color=m.kind==='bad'?'var(--bad)':m.kind==='hi'?'var(--sun)':'var(--g)';clearTimeout(mt);mt=setTimeout(()=>{if($('msg'))$('msg').textContent=''},2500)}
setInterval(()=>{if(!s||s.phase!=='play'||!$('tb'))return;const now=Date.now()+off;
  $('tb').firstChild.style.width=Math.max(0,(s.turnEnd-now)/(s.set.turn*10))+'%';
  $('rb').firstChild.style.width=Math.max(0,(s.roundEnd-now)/(s.set.round*10))+'%';
  $('rt').textContent='Round time left: '+Math.max(0,Math.ceil((s.roundEnd-now)/1000))+'s'},150);

function filterBar(items) {
  const subs = ['All', ...new Set(items.map(x => x.subject))];

  return `<div class="sets" style="margin:12px 0">

function renderExamCard(ex) {
  const target = new Date(ex.date);
  const days = Math.max(0, Math.ceil((target - Date.now()) / 86400000));
  const niceDate = target.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const niceTime = target.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return `<div class="card">
    <div><span class="badge">${esc(ex.subject)}</span><span class="badge">${esc(ex.board)}</span></div>
    <h2 style="margin-top:6px">${esc(ex.paper)}</h2>
    <p class="mut">${niceDate} at ${niceTime} · Duration: ${esc(ex.duration)}</p>
    <div class="countdown">${days} day${days === 1 ? '' : 's'} to go</div>
  </div>`;
}

    app.innerHTML = `<h1>Revision Resources</h1><p class="mut">Key notes and formulas mapped to your GCSE exam board.</p>${filterBar(STUDY_DATA.resources)}
      ${list.map(r => `<div class="card">
        <div><span class="badge">${esc(r.subject)}</span><span class="badge">${esc(r.board)}</span></div>
        <h2 style="margin-top:6px">${esc(r.topic)}</h2>
        <p>${esc(r.summary)}</p>
        <ul>${r.keyPoints.map(pt => `<li>${esc(pt)}</li>`).join('')}</ul>
        <button class="lnk" onclick="goTab('game')">Practise ${esc(r.subject)} in ReviseRush →</button>
      </div>`).join('') || '<p class="mut">No resources match that filter yet.</p>'}`;
    return;
  }

  if (pageTab === 'questions') {
    const list = STUDY_DATA.examQuestions.filter(q => (fSub === 'All' || q.subject === fSub) && (fBoard === 'All' || q.board === fBoard));
    app.innerHTML = `<h1>Exam Practice Questions</h1><p class="mut">Attempt the question first, then reveal the official-style mark scheme.</p>${filterBar(STUDY_DATA.examQuestions)}
      ${list.map((q, i) => `<div class="card">
        <div><span class="badge">${esc(q.subject)}</span><span class="badge">${esc(q.board)}</span><span class="badge">${esc(q.topic)}</span><span class="badge">${q.marks} marks</span></div>
        <p style="font-weight:600;margin-top:10px">${esc(q.question)}</p>
        <button class="ghost" onclick="const el=$('ms_${i}');el.hidden=!el.hidden">Show / Hide Mark Scheme</button>
        <div id="ms_${i}" class="ms" hidden>
          <b>Mark Scheme:</b>
          <ul>${q.markScheme.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
          <p class="mut"><b>Examiner Tip:</b> ${esc(q.tip)}</p>
        </div>
      </div>`).join('') || '<p class="mut">No questions match that filter yet.</p>'}`;
    return;
  }

  if (pageTab === 'exams') {
    const list = STUDY_DATA.exams.filter(e => (fSub === 'All' || e.subject === fSub) && (fBoard === 'All' || e.board === fBoard));
    app.innerHTML = `<h1>GCSE Exam Timetable &amp; Countdowns</h1><p class="mut">Summer 2027 key dates (check your school's individual candidate timetable for exact rooming).</p>${filterBar(STUDY_DATA.exams)}
      <div class="grid2">${list.map(ex => renderExamCard(ex)).join('')}</div>`;
  }
}

window.onpopstate = () => {
  pageTab = location.pathname === '/game' ? 'game' : (location.pathname.slice(1) || 'hub');
  if (!['hub', 'resources', 'questions', 'exams', 'game'].includes(pageTab)) pageTab = 'hub';
  renderShell();
};

boot();
</script></body></html>
