<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReviseRush — Summer 2027 Exam Dates &amp; Maths Revision Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --warn-bg: #451a03;
      --warn-border: #f59e0b;
      --warn-text: #fde68a;
      --border: #334155;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
    nav { display: flex; gap: 0.5rem; }
    nav button {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    nav button.active {
      background: var(--accent-dark);
      border-color: var(--accent);
    }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    .panel { display: none; }
    .panel.active { display: block; }
    .contingency-box {
      background: var(--warn-bg);
      border-left: 4px solid var(--warn-border);
      color: var(--warn-text);
      padding: 0.85rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    input[type="search"], select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.5rem;
      max-height: 260px;
      overflow-y: auto;
      background: var(--surface);
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .subject-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .subject-item:hover { background: var(--surface-alt); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    th { background: var(--surface-alt); color: var(--accent); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--surface-alt);
    }
    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      padding: 2rem;
      text-align: center;
      border-radius: 10px;
      color: var(--muted);
    }
    .track-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .track-tabs button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .track-tabs button.active {
      background: var(--accent-dark);
      border-color: var(--accent);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .card h3, .card h4 { margin-top: 0; color: var(--accent); }
    .mark-scheme {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: var(--bg);
      border-left: 3px solid var(--success);
      border-radius: 6px;
      font-size: 0.92rem;
      display: none;
    }
    .mark-scheme.open { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>ReviseRush • Summer 2027</h1>
    <nav>
      <button id="tab-exams" class="active" type="button">My Exam Dates</button>
      <button id="tab-maths" type="button">Exam Questions &amp; Revision Notes</button>
    </nav>
  </header>

  <main>
    <!-- TAB 1: MY EXAM DATES -->
    <section id="panel-exams" class="panel active">
      <div class="contingency-box" id="contingency-banner">
        <strong>Contingency Day:</strong> Loading...
      </div>

      <div class="controls">
        <input type="search" id="subject-search" placeholder="Search subject (e.g. Mathematics, Biology)..." />
        <select id="board-filter">
          <option value="ALL">All Boards (OCR, AQA, Edexcel)</option>
          <option value="OCR">OCR</option>
          <option value="AQA">AQA</option>
          <option value="Edexcel">Pearson Edexcel</option>
        </select>
        <button type="button" class="btn-secondary" id="clear-subjects-btn">Clear Selected</button>
      </div>

      <div id="subject-grid" class="subject-grid"></div>
      <div id="exams-output"></div>
    </section>

    <!-- TAB 2: EXAM QUESTIONS & REVISION NOTES (MATHS ONLY) -->
    <section id="panel-maths" class="panel">
      <div class="track-tabs" id="maths-track-tabs"></div>
      <div id="maths-track-body"></div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "reviserush_session_token";
    const LOCAL_SUBJECTS_KEY = "reviserush_selected_subjects_2027";

    function getSessionToken() {
      let token = localStorage.getItem(TOKEN_KEY);
      if (!token) {
        token = "rr_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(TOKEN_KEY, token);
      }
      return token;
    }

    const sessionToken = getSessionToken();
    let catalogSubjects = [];
    // Starts empty unless the user explicitly selected subjects previously
    let selectedKeys = new Set(JSON.parse(localStorage.getItem(LOCAL_SUBJECTS_KEY) || "[]"));
    let mathsTracks = [];
    let completedQuestions = new Set();
    let activeTrackId = "edexcel-maths";

    // Tab switching
    const tabExams = document.getElementById("tab-exams");
    const tabMaths = document.getElementById("tab-maths");
    const panelExams = document.getElementById("panel-exams");
    const panelMaths = document.getElementById("panel-maths");

    tabExams.addEventListener("click", () => {
      tabExams.classList.add("active");
      tabMaths.classList.remove("active");
      panelExams.classList.add("active");
      panelMaths.classList.remove("active");
    });

    tabMaths.addEventListener("click", () => {
      tabMaths.classList.add("active");
      tabExams.classList.remove("active");
      panelMaths.classList.add("active");
      panelExams.classList.remove("active");
    });

    async function init() {
      const catRes = await fetch("/api/catalog");
      const catData = await catRes.json();
      catalogSubjects = catData.subjects || [];
      document.getElementById("contingency-banner").innerHTML =
        `<strong>Contingency Day:</strong> ${catData.contingency.label} — ${catData.contingency.note}`;

      renderSubjectPicker();
      await syncAndRenderMyExams();

      const mathsRes = await fetch(`/api/maths-revision?token=${encodeURIComponent(sessionToken)}`);
      const mathsData = await mathsRes.json();
      mathsTracks = mathsData.tracks || [];
      completedQuestions = new Set(mathsData.completed || []);
      if (mathsTracks.length) activeTrackId = mathsTracks[0].id;
      renderMathsHub();
    }

    function renderSubjectPicker() {
      const searchVal = document.getElementById("subject-search").value.trim().toLowerCase();
      const boardVal = document.getElementById("board-filter").value;
      const grid = document.getElementById("subject-grid");

      const filtered = catalogSubjects.filter((s) => {
        const matchBoard = boardVal === "ALL" || s.board === boardVal;
        const matchText = !searchVal || s.label.toLowerCase().includes(searchVal);
        return matchBoard && matchText;
      });

      grid.innerHTML = filtered.map((s) => `
        <label class="subject-item">
          <input type="checkbox" value="${s.key}" ${selectedKeys.has(s.key) ? "checked" : ""} />
          <span>${s.label}</span>
        </label>
      `).join("");

      grid.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener("change", async () => {
          if (cb.checked) selectedKeys.add(cb.value);
          else selectedKeys.delete(cb.value);
          localStorage.setItem(LOCAL_SUBJECTS_KEY, JSON.stringify(Array.from(selectedKeys)));
          await saveAndRenderMyExams();
        });
      });
    }

    async function syncAndRenderMyExams() {
      const keysArr = Array.from(selectedKeys);
      if (keysArr.length === 0) {
        renderExamTable([]);
        return;
      }
      const res = await fetch(`/api/my-exams?token=${encodeURIComponent(sessionToken)}&subjects=${encodeURIComponent(keysArr.join(","))}`);
      const data = await res.json();
      renderExamTable(data.exams || []);
    }

    async function saveAndRenderMyExams() {
      const keysArr = Array.from(selectedKeys);
      const res = await fetch("/api/my-exams", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: sessionToken, selectedKeys: keysArr })
      });
      const data = await res.json();
      renderExamTable(data.exams || []);
    }

    function renderExamTable(exams) {
      const out = document.getElementById("exams-output");
      if (selectedKeys.size === 0 || exams.length === 0) {
        out.innerHTML = `<div class="empty-state">No subjects selected yet. Tick your subjects above to display only your personal Summer 2027 exam dates.</div>`;
        return;
      }
      out.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Session</th>
              <th>Board</th>
              <th>Subject</th>
              <th>Paper Code &amp; Title</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody>
            ${exams.map((e) => `
              <tr>
                <td><strong>${e.date}</strong></td>
                <td><span class="badge">${e.session}</span></td>
                <td>${e.board}</td>
                <td>${e.subject}</td>
                <td><strong>${e.code}</strong> — ${e.paper}</td>
                <td>${e.duration}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderMathsHub() {
      const tabsEl = document.getElementById("maths-track-tabs");
      const bodyEl = document.getElementById("maths-track-body");

      tabsEl.innerHTML = mathsTracks.map((t) => `
        <button type="button" class="${t.id === activeTrackId ? "active" : ""}" data-track="${t.id}">
          ${t.label}
        </button>
      `).join("");

      tabsEl.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeTrackId = btn.dataset.track;
          renderMathsHub();
        });
      });

      const track = mathsTracks.find((t) => t.id === activeTrackId);
      if (!track) return;

      bodyEl.innerHTML = `
        <div class="card">
          <h3>${track.label} (${track.specCode})</h3>
          <p style="color: var(--muted); margin-bottom: 0;">${track.structure}</p>
        </div>

        <div class="card">
          <h3>Revision Notes</h3>
          ${track.notes.map((n) => `<p><strong>${n.title}:</strong> ${n.body}</p>`).join("")}
        </div>

        <h3>Practice Exam Questions</h3>
        ${track.questions.map((q, i) => {
          const compKey = `${track.id}::${q.id}`;
          const isDone = completedQuestions.has(compKey);
          return `
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                <span class="badge">${q.paper} • ${q.marks} marks</span>
                <label style="font-size:0.85rem; cursor:pointer;">
                  <input type="checkbox" data-complete="${q.id}" ${isDone ? "checked" : ""} /> Completed
                </label>
              </div>
              <p><strong>Q${i + 1}.</strong> ${q.prompt}</p>
              <button type="button" class="btn-secondary" data-toggle="ms-${q.id}">Show / Hide Mark Scheme</button>
              <div id="ms-${q.id}" class="mark-scheme">${q.answer}</div>
            </div>
          `;
        }).join("")}
      `;

      bodyEl.querySelectorAll("button[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById(btn.dataset.toggle).classList.toggle("open");
        });
      });

      bodyEl.querySelectorAll("input[data-complete]").forEach((cb) => {
        cb.addEventListener("change", async () => {
          const res = await fetch("/api/maths-revision/progress", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: sessionToken,
              trackId: track.id,
              questionId: cb.dataset.complete,
              completed: cb.checked
            })
          });
          const data = await res.json();
          completedQuestions = new Set(data.completed || []);
        });
      });
    }

    document.getElementById("subject-search").addEventListener("input", renderSubjectPicker);
    document.getElementById("board-filter").addEventListener("change", renderSubjectPicker);
    document.getElementById("clear-subjects-btn").addEventListener("click", async () => {
      selectedKeys.clear();
      localStorage.setItem(LOCAL_SUBJECTS_KEY, "[]");
      renderSubjectPicker();
      await saveAndRenderMyExams();
    });

    init();
  </script>
</body>
</html>
