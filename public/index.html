<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReviseRush – Your revision hub</title>
<meta name="description" content="ReviseRush is your revision hub for GCSE and A-level. Study your subjects, practise exam questions, track your confidence and play revision games.">
<meta property="og:title" content="ReviseRush – Your revision hub">
<meta property="og:description" content="Revise GCSE and A-level subjects, track your confidence and practise with friends.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f9d6b'/%3E%3Cpath d='M20 34l9 9 16-19' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#e9f6ef;--card:#fff;--ink:#14324a;--mut:#58717f;--g:#1f9d6b;--on:#fff;--blue:#3a7bd5;--pur:#7c5cd6;--sun:#e8a712;--bad:#e8573f;--line:#cfe3da}
@media (prefers-color-scheme:dark){:root{--bg:#0e2230;--card:#163247;--ink:#e8f3ee;--mut:#9fb8c6;--g:#34c58a;--on:#08301f;--blue:#6aa3f0;--pur:#a58cf2;--sun:#f4c04d;--bad:#ff7a60;--line:#2a4a60}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Figtree,system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:660px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big,.pts,.turn,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:2.3rem;line-height:1.1}h2{font-size:1.35rem}p{margin:.4em 0}
.mut{color:var(--mut)}.bad{color:var(--bad)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}.brand{font-size:2.4rem}.brand span{color:var(--g)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
button{font:600 1rem Figtree,system-ui,sans-serif;border:0;border-radius:12px;padding:12px 18px;background:var(--g);color:var(--on);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.ghost,.back,.lnk{background:transparent;color:var(--ink);border:2px solid var(--line)}
.back{border:0;padding:6px 0;margin-bottom:8px}.lnk{padding:4px 10px;font-size:.9rem;color:var(--mut)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input:not([type=checkbox]){font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.menu{display:grid;gap:12px;margin:18px 0}
.mb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px 18px;font:800 1.3rem "Bricolage Grotesque",Figtree,sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);border-left:10px solid var(--g);border-radius:16px;width:100%}
.mb span{font:400 1rem Figtree,system-ui,sans-serif;color:var(--mut)}
.mb.b{border-left-color:var(--blue)}.mb.p{border-left-color:var(--pur)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sets label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mut)}.sets select{margin-top:4px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chipb{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:8px 14px;border-radius:20px}.chipb.on{border-color:var(--g);background:var(--g);color:var(--on)}.chipb:disabled{opacity:.45}
.mb.a{border-left-color:var(--sun)}.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 10px}.lb{width:100%;border-collapse:collapse}.lb th,.lb td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}.lb tr.me td{font-weight:800;color:var(--g)}
.sub{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tps{padding:0 0 8px 8px;display:grid;gap:2px}label.c{display:block;padding:2px 0}
.row{display:flex;gap:10px;align-items:center}.row>input{flex:1}
.scores{display:flex;gap:8px;overflow-x:auto;padding:2px}
.pl{flex:1 0 110px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
.pl.on{border-color:var(--g);transform:translateY(-3px)}.pl.out{opacity:.4}
.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-size:1.4rem}.heart{color:var(--bad)}.heart.lost{opacity:.2}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g);width:100%}#tb i{background:var(--bad)}
.q{font-size:1.8rem;margin:6px 0 10px}.turn{font-size:1.2rem}#msg{min-height:1.6em;font-weight:600}
.code{font:800 3rem "Bricolage Grotesque",sans-serif;letter-spacing:.15em;color:var(--g)}
.hero{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}
.hero h1{font-size:2.15rem}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--g)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.home-tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);min-height:112px}
.home-tile strong{display:block;font:800 1.08rem "Bricolage Grotesque",sans-serif;margin:5px 0}
.home-tile small{display:block;color:var(--mut);font-size:.88rem;font-weight:400}
.home-tile.green{border-left:8px solid var(--g)}.home-tile.blue{border-left:8px solid var(--blue)}.home-tile.purple{border-left:8px solid var(--pur)}.home-tile.yellow{border-left:8px solid var(--sun)}
.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.subject-tile{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:12px;text-align:left;border-radius:13px;font-weight:700}
.subject-choice{display:grid;grid-template-columns:minmax(0,1fr) 145px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.subject-choice label{display:flex;align-items:center;gap:8px}.subject-choice select{width:100%;font-size:.85rem;padding:6px}.subject-group-title{margin:12px 0 4px;color:var(--g);font-weight:800}
.progress-legend{display:flex;flex-wrap:wrap;gap:7px}.progress-legend span{border:1px solid var(--line);border-radius:20px;padding:5px 9px;font-size:.85rem}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px}

.topic-list{display:grid;gap:8px;margin-top:12px}.topic-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:13px;border-radius:13px}.topic-row span:first-child{display:flex;flex-direction:column}.topic-row small{color:var(--mut);font-weight:400;margin-top:3px}.confidence-dot{font-size:1.3rem}.confidence-dot.confident{color:var(--g)}.confidence-dot.somewhat{color:var(--sun)}.confidence-dot.unsure{color:var(--bad)}.confidence-options{display:grid;gap:8px}.confidence-choice{background:var(--bg);color:var(--ink);border:2px solid var(--line);text-align:left}.confidence-choice.selected{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.confidence-choice.good{border-left:7px solid var(--g)}.confidence-choice.mid{border-left:7px solid var(--sun)}.confidence-choice.low{border-left:7px solid var(--bad)}.model-answer{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}.model-answer h3{margin:0 0 6px;font-family:"Bricolage Grotesque",sans-serif}.mark-entry{display:block;font-weight:600;margin-top:12px}.mark-entry input{display:block;margin-top:5px;max-width:140px}.progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.progress-stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.progress-stats b{display:block;font:800 1.6rem "Bricolage Grotesque",sans-serif}.progress-stats small{color:var(--mut)}.exam-question h2{font-size:1.12rem;line-height:1.35}
@media(max-width:420px){.subject-choice{grid-template-columns:minmax(0,1fr) 125px}.hero h1{font-size:1.9rem}}
.chip{display:inline-block;border:2px solid var(--g);color:var(--g);border-radius:20px;padding:2px 12px;margin:3px 4px 3px 0;font-weight:600}
.chip.hi{border-color:var(--sun);color:var(--sun)}.chip.miss{border-style:dashed;opacity:.85}
@media (prefers-reduced-motion:reduce){.pl.on{transform:none}}
</style></head><body><main id="app"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO='<svg viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="ReviseRush logo"><rect width="64" height="64" rx="16" fill="var(--g)"/><rect x="9" y="13" width="46" height="31" rx="9" fill="#fff"/><path d="M19 43v11l12-11z" fill="#fff"/><path d="M21 29l8 8 14-17" fill="none" stroke="var(--g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="12" r="8" fill="var(--sun)"/></svg>';
let ws=null,s=null,off=0,err='',mt=null,view='menu',sel=null,act=null,board={},needsProfile=false,sess=null,me=null,cfgSrv={accounts:false},meta=null,curriculum=null,examBoards=['AQA','Pearson Edexcel','OCR','Eduqas','WJEC','CCEA'],subjectBoards={},mode='in',msgA='',dsub=null,dbd={},lbp='daily',lbs=null,lbb=null,activeSubject='',activeTopic='',revisionBoards={},cfg={lives:3,turn:20,round:60,rounds:5,skips:2,need:5};
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const isHost=()=>s.host===s.you;

function connect(first){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send(first);
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='state'){s=m;off=m.serverNow-Date.now();render()}
    else if(m.t==='toast')toast(m);
    else if(m.t==='err'){err=m.text;if(!s)home()}};
  ws.onclose=()=>{if(s)app.insertAdjacentHTML('afterbegin','<p class="bad">Connection lost. Refresh the page to rejoin.</p>')};
}
function leave(){const w=ws;s=null;sel=null;act=null;board={};ws=null;view='menu';err='';if(w)w.close();home();if(sess&&cfgSrv.accounts)loadMe().then(()=>{if(view==='menu'&&!s)home()})}
function leaveGame(){if(confirm('Leave this game and go back to the home page?'))leave()}

async function ensureFresh(){if(sess&&sess.expires_at-Date.now()/1000<120){try{const j=await api('/api/refresh',{refresh_token:sess.refresh_token});store(j.session)}catch{store(null);me=null}}}
const store=v=>{sess=v;try{v?localStorage.setItem('rr_sess',JSON.stringify(v)):localStorage.removeItem('rr_sess')}catch{}};
async function api(path,body,auth){
  const h={'Content-Type':'application/json'};
  if(auth){await ensureFresh();if(!sess)throw new Error('Please sign in again.');h.Authorization='Bearer '+sess.access_token}
  const r=await fetch(path,{method:body===null||body===undefined?'GET':'POST',headers:h,body:body===null||body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong.');e.code=j.code;throw e}return j}
async function loadMe(){me=null;needsProfile=false;if(!sess)return;try{me=await api('/api/me',null,true)}catch(e){me=null;if(e.code==='no_profile')needsProfile=true}}
async function loadMeta(){if(!meta){try{meta=await api('/api/subjects')}catch{meta=[]}}}
async function loadCurriculum(){if(!curriculum){try{const j=await api('/api/curriculum');curriculum=j.curriculum;examBoards=j.examBoards||examBoards;subjectBoards=j.subjectBoards||{}}catch{curriculum={GCSE:['Maths','English Language','English Literature','Combined Science','Biology','Chemistry','Physics','Geography','History','French','Spanish','Computer Science','Business Studies','PE','RS','Music'],'A-level':['Maths','English Literature','English Language','Chemistry','Biology','Physics','Psychology','History','Geography','Politics','Economics','French','Spanish','Business','Sociology']};subjectBoards={}}}}
const qualForYear=y=>[9,10,11].includes(+y)?'GCSE':[12,13].includes(+y)?'A-level':'';
async function boot(){try{sess=JSON.parse(localStorage.getItem('rr_sess')||'null')}catch{sess=null}
  try{cfgSrv=await api('/api/config')}catch{}
  if(sess&&cfgSrv.accounts){await loadMe();if(needsProfile)view='setup'}home()}
function acctBar(){if(!cfgSrv.accounts)return '';
  if(needsProfile)return '<div class="acct"><span class="bad">Finish setting up your account</span><button class="lnk" id="su">Finish</button></div>';
  return me?`<div class="acct"><span>Hi <b>${esc(me.display_name)}</b> · 🔥 ${me.streak}-day streak</span><button class="lnk" id="pf">Profile</button></div>`
  :`<div class="acct"><span class="mut">Sign in to keep streaks and join leaderboards</span><button class="lnk" id="si">Sign in</button></div>`}
function dailyCard(){const r=s.result;
  if(!r)return '<div class="card"><p>Saving your score…</p></div>';
  if(r.error)return '<div class="card"><p class="bad">Could not save your score. Check your connection and try again.</p></div>';
  return `<div class="card"><h2>Daily challenge complete</h2><p><b>${s.players[0].pts}</b> points · ranked <b>#${r.rank}</b> today</p><p>🔥 <b>${r.streak}</b>-day streak (best ${r.best})</p><button id="lbx" style="margin-top:8px">View leaderboard</button></div>`}

function home(){
  if(view==='menu'){
    const subjects=me&&me.subjects||[];
    const dailyDone=me&&me.doneToday&&me.doneToday.length;
    app.innerHTML=`<div class="logo">${LOGO}<div class="brand">Revise<span>Rush</span></div></div>
    ${acctBar()}
    <div class="hero"><div class="eyebrow">Your revision hub</div><h1>Ready to make progress?</h1><p class="mut">Your subjects, your revision and your daily challenge — all in one place.</p>
    ${me?`<p><b>${esc(me.qualification||qualForYear(me.year)||'GCSE')} · Year ${me.year}</b> &nbsp; ${me.streak?`🔥 ${me.streak}-day streak`:''}</p>`:'<p class="mut">Sign in or create an account to save your subjects and track your progress.</p>'}
    </div>
    <div class="section-head"><h2>Today's challenge</h2>${dailyDone?'<span class="mut">Completed ✓</span>':''}</div>
    <button class="mb a" id="m4">${dailyDone?'Try another daily challenge':'Take the daily challenge'}<span>Five questions. Build your streak and keep your revision ticking over.</span></button>
    <div class="section-head"><h2>My subjects</h2><button class="lnk" id="pf">${me?'Edit':'Choose subjects'}</button></div>
    ${me&&subjects.length?`<div class="subject-grid">${subjects.map(x=>`<button class="subject-tile" data-subject="${esc(x)}">📘 ${esc(x)}<small>${esc((me.subjectBoards||{})[x]||'Choose exam board')}</small></button>`).join('')}</div>`:`<div class="card"><p class="mut">Choose your GCSE or A-level subjects to build your personal revision space.</p><button id="chooseSubjects">Choose my subjects</button></div>`}
    <div class="section-head"><h2>Explore Name It!</h2></div>
    <div class="home-grid">
      <button class="home-tile green" id="revision"><span>📚</span><strong>Revision</strong><small>Notes, topic confidence and exam practice</small></button>
      <button class="home-tile blue" id="m1"><span>🎮</span><strong>Play our game</strong><small>Solo revision games and quick practice</small></button>
      <button class="home-tile purple" id="m2"><span>👥</span><strong>Host a game</strong><small>Start a live game with friends or your class</small></button>
      <button class="home-tile yellow" id="m3"><span>🔑</span><strong>Join a game</strong><small>Enter a room code to play together</small></button>
    </div>
    ${cfgSrv.accounts?'<button class="mb" id="m5">Leaderboards<span>See daily scores and revision streaks.</span></button>':''}`;
    $('m4').onclick=()=>{err='';view=me?'daily':'auth';mode='in';home()};
    $('m1').onclick=()=>{view='games';home()};
    $('m2').onclick=()=>{view='host';err='';home()};
    $('m3').onclick=()=>{view='join';err='';home()};
    $('m5')&&($('m5').onclick=()=>{view='lb';home()});
    $('pf')&&($('pf').onclick=()=>{if(me){err='';view='profile'}else{view='auth';mode='up'}home()});
    $('chooseSubjects')&&($('chooseSubjects').onclick=()=>{view=me?'profile':'auth';mode='up';home()});
    $('revision').onclick=()=>{view=me?'revision':'auth';mode='in';home()};
    app.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{activeSubject=b.dataset.subject;view='subject';home()});
    return;
  }
  if(view==='games'){
    app.innerHTML=`<button class="back" id="bk">← Home</button><h1>Play our game</h1><p class="mut">Choose how you'd like to revise with Name It!</p>
    <button class="mb" id="solo">Play solo<span>Practise on your own, at your own pace.</span></button>
    <button class="mb b" id="joinGame">Join a live game<span>Enter a room code shared by your teacher or friend.</span></button>
    <div class="card"><h2>How to play</h2><p>Take turns naming answers to the question. A correct answer earns points, and higher-level answers can earn more.</p></div>`;
    $('bk').onclick=()=>{view='menu';home()};$('solo').onclick=()=>{view='solo';err='';home()};$('joinGame').onclick=()=>{view='join';err='';home()};return;
  }
  if(view==='revision')return revisionView();
  if(view==='subject')return subjectView();
  if(view==='topic')return topicDetailView();
  if(view==='auth')return authView();
  if(view==='daily')return dailyView();
  if(view==='lb')return lbView();
  if(view==='profile')return profileView();
  if(view==='setup')return setupView();
  const j=view==='join',title={solo:'Play solo',host:'Host a game',join:'Join a game'}[view];
  app.innerHTML=`<button class="back" id="bk">← Back</button><h1>${title}</h1>
  <div class="card"><input id="nm" maxlength="16" placeholder="Your name" aria-label="Your name" value="${me&&!j?esc(me.display_name):''}">${j?'<input id="cd" maxlength="4" placeholder="Room code" aria-label="Room code" style="text-transform:uppercase;margin-top:8px">':''}
  <button id="go" style="width:100%;margin-top:10px">${j?'Join':'Continue'}</button></div><p class="bad">${esc(err)}</p>`;
  $('bk').onclick=()=>{view='menu';err='';home()};
  const go=()=>{err='';connect({t:j?'join':'create',name:$('nm').value,code:j?$('cd').value:undefined,solo:view==='solo'})};
  $('go').onclick=go;app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});$('nm').focus();
}
function yearSelect(v){return `<select id="yr" aria-label="Year group" style="width:100%"><option value="">Choose your year</option>${[9,10,11,12,13].map(y=>`<option value="${y}" ${+v===y?'selected':''}>Year ${y} · ${y<=11?'GCSE':'A-level'}</option>`).join('')}</select>`}
function subjectBoxes(sel, savedBoards={}){
  if(!curriculum)return '<p class="mut">Loading subjects…</p>';
  return Object.entries(curriculum).map(([qual,list])=>`<div class="subject-group" data-subject-group="${qual}"><div class="subject-group-title">${qual} subjects</div>${list.map(subject=>{
    const available=(subjectBoards&&subjectBoards[qual]&&subjectBoards[qual][subject])||[];
    const saved=savedBoards[subject]==='Pearson Edexcel'?'Edexcel':savedBoards[subject];
    const chosen=available.includes(saved)?saved:(available.length===1?available[0]:'');
    const options=available.length?available.map(b=>`<option value="${esc(b)}" ${chosen===b?'selected':''}>${b==='Edexcel'?'Pearson Edexcel':esc(b)}</option>`).join(''):'<option value="">Specification not added yet</option>';
    return `<div class="subject-choice"><label><input type="checkbox" data-sj data-qual="${qual}" value="${esc(subject)}" ${sel.includes(subject)?'checked':''}> ${esc(subject)}</label><select data-board-for="${esc(subject)}" aria-label="${esc(subject)} exam board" ${available.length?'':'disabled'}>${options}</select></div>`;
  }).join('')}</div>`).join('');
}
function syncSubjectGroups(){const y=$('yr')&&$('yr').value,q=qualForYear(y);app.querySelectorAll('[data-subject-group]').forEach(g=>g.style.display=g.dataset.subjectGroup===q?'block':'none')}
const picked=()=>{const year=+$('yr').value||null,q=qualForYear(year),checked=[...app.querySelectorAll('[data-sj]:checked')].filter(c=>c.dataset.qual===q);const subjects=checked.map(c=>c.value),subjectBoards={};subjects.forEach(subject=>{const b=[...app.querySelectorAll("[data-board-for]")].find(e=>e.dataset.boardFor===subject);if(b)subjectBoards[subject]=b.value});return {year,subjects,subjectBoards}};
function setupView(){
  if(!sess){view='auth';return home()}
  if(!curriculum){app.innerHTML='<p class="mut">Loading subjects…</p>';loadCurriculum().then(()=>{if(view==='setup')home()});return}
  app.innerHTML=`<button class="back" id="bk">← Home</button><h1>Finish setting up</h1><p class="mut">Choose your qualification, year, subjects and exam boards.</p>
  <div class="card"><input id="dn" maxlength="16" placeholder="Display name (shown on leaderboards)" aria-label="Display name"></div>
  <div class="card"><h2>About you</h2><p class="mut">Your year group</p>${yearSelect('')}<p class="mut" style="margin-top:12px">Select your subjects and exam boards</p>${subjectBoxes([])}</div>
  <button id="go" style="width:100%">Save and continue</button><button class="lnk" id="out" style="margin-top:8px">Sign out</button><p class="bad">${esc(err)}</p>`;
  $('yr').onchange=syncSubjectGroups;syncSubjectGroups();

  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{act=b.dataset.s;lobby()});
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const nb=b.dataset.b;[...sel].forEach(k=>{if(k.startsWith(act+'|')&&!k.startsWith(act+'|'+nb+'|'))sel.delete(k)});board[act]=nb;lobby()});
  app.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{c.checked?sel.add(key(c.dataset.t)):sel.delete(key(c.dataset.t));lobby()});
  $('all').onclick=()=>{B.topics.forEach(n=>sel.add(key(n)));lobby()};$('none').onclick=()=>{B.topics.forEach(n=>sel.delete(key(n)));lobby()};
  $('st').onclick=()=>send({t:'start',topics:[...sel],set:cfg});
  window.scrollTo(0,y);
}

function render(){
  const v=$('ans')?$('ans').value:'';
  if(s.phase==='lobby')return lobby();
  const top=s.players.slice().sort((a,b)=>b.pts-a.pts);
  if(s.phase==='play'){
    const mine=s.turn===s.you,who=s.players.find(p=>p.id===s.turn),me=s.players.find(p=>p.id===s.you);
    app.innerHTML=`<button class="back" id="hm">← Home</button>${scores()}<div class="card"><p class="mut">Round ${s.ri+1} of ${s.n} · ${esc(s.topic)}</p><div class="q big">${esc(s.q)}</div>
    ${s.solo?`<p class="turn">Found ${s.log.length} of ${s.set.need} different answers</p><div class="bar"><i style="width:${Math.min(100,s.log.length/s.set.need*100)}%"></i></div><p class="mut">No timer. Take your time and name ${s.set.need} to move on.</p>`:`<div class="bar" id="rb"><i></i></div><p class="mut" id="rt"></p>
    <div class="turn">${mine?'Your turn!':esc(who.name)+'’s turn'}</div><div class="bar" id="tb"><i></i></div>`}
    <div class="row"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${mine?'Type your answer':'Wait for your turn'}" aria-label="Your answer" ${mine?'':'disabled'}><button id="sub" ${mine?'':'disabled'}>Answer</button></div>
    ${s.solo?'<button class="ghost" id="sk" style="margin-top:8px">Skip question</button>':s.set.skips?`<button class="ghost" id="sk" style="margin-top:8px" ${mine&&me.skips>0?'':'disabled'}>Skip question (${me.skips} left, −10 points)</button>`:''}
    <p id="msg"></p><div>${s.log.map(l=>`<span class="chip ${l.tier===50?'hi':''}">${esc(l.text)} (${esc(l.by)})</span>`).join('')}</div></div>`;
    const go=()=>{const a=$('ans');if(a.value.trim()){send({t:'answer',text:a.value});a.value=''}};
    $('sub').onclick=go;$('ans').onkeydown=e=>{if(e.key==='Enter')go()};if($('sk'))$('sk').onclick=()=>send({t:'skip'});$('hm').onclick=leaveGame;
    if(mine){$('ans').value=v;$('ans').focus()}
  }else if(s.phase==='between'){
    app.innerHTML=`<button class="back" id="hm">← Home</button><div class="card"><h2>Round over</h2><p class="mut">${esc(s.q)}</p><p><b>${s.solo?'Answers you missed':'Answers nobody found'}</b> (gold = grade 7–9):</p>
    <div>${s.missed.map(m=>`<span class="chip miss ${m.tier===50?'hi':''}">${esc(m.text)}</span>`).join('')||'You found every answer!'}</div></div>
    <div class="card">${top.map(p=>`<p><b>${esc(p.name)}</b>: ${p.pts} points ${p.lives>0?'':'(out)'}${s.rpts[p.name]?' · +'+s.rpts[p.name]+' this round':''}</p>`).join('')}</div>
    ${isHost()?`<button id="nx" style="width:100%">${s.last?'See results':'Next round'}</button>`:'<p class="mut">Waiting for the host…</p>'}`;
    if(isHost())$('nx').onclick=()=>send({t:'next'});$('hm').onclick=leaveGame;
  }else{
    app.innerHTML=`<h1>${s.daily?'Daily challenge':s.solo?'Game over!':esc(top[0].name)+' wins!'}</h1>${s.daily?dailyCard():''}<div class="card">${top.map((p,i)=>`<p>${i+1}. <b>${esc(p.name)}</b>: ${p.pts} points</p>`).join('')}</div>
    <h2 style="margin-top:22px">Revision summary</h2><p class="mut">Every answer from your game. <span class="chip">✓ You said it</span> <span class="chip miss">You missed it</span> <span class="chip hi">Grade 7–9</span></p>
    ${(s.review||[]).map(r=>`<div class="card"><p class="mut">${esc(r.topic)}</p><p><b>${esc(r.q)}</b></p>${r.answers.map(a=>`<span class="chip ${a.tier===50?'hi':''} ${a.by===s.you?'':'miss'}">${a.by===s.you?'✓ ':''}${esc(a.text)}</span>`).join('')}</div>`).join('')}
    ${s.daily?'':isHost()?`<button id="ag" style="width:100%">${s.solo?'Play again':'Back to lobby'}</button>`:'<p class="mut">Waiting for the host…</p>'}<button class="back" id="hm" style="margin-top:10px">Back to home</button>`;
    if($('ag'))$('ag').onclick=()=>send({t:'again'});$('hm').onclick=leave;if($('lbx')){const dd=s.daily;$('lbx').onclick=()=>{leave();lbp='daily';lbs=dd.subject;lbb=dd.board;view='lb';home()}}
  }
}
function toast(m){const e=$('msg');if(!e)return;e.textContent=m.text;e.style.color=m.kind==='bad'?'var(--bad)':m.kind==='hi'?'var(--sun)':'var(--g)';clearTimeout(mt);mt=setTimeout(()=>{if($('msg'))$('msg').textContent=''},2500)}
setInterval(()=>{if(!s||s.phase!=='play'||!$('tb'))return;const now=Date.now()+off;
  $('tb').firstChild.style.width=Math.max(0,(s.turnEnd-now)/(s.set.turn*10))+'%';
  $('rb').firstChild.style.width=Math.max(0,(s.roundEnd-now)/(s.set.round*10))+'%';
  $('rt').textContent='Round time left: '+Math.max(0,Math.ceil((s.roundEnd-now)/1000))+'s'},150);
boot();
</script></body></html>
